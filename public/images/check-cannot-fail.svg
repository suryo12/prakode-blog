<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">The four outcomes of a check</title>
  <desc id="d">A two by two grid. Columns: the check is green, the check is red. Rows: the claim is true, the claim is false. Claim true and green: fine, the usual case. Claim true and red: a false alarm, annoying but visible. Claim false and red: caught, the check did its job. Claim false and green: the dangerous cell, wrong code with a green check, and it looks exactly like the usual case. Breaking the code on purpose is how you visit that cell and find out whether it exists.</desc>
  <defs>
    <marker id="arr-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b4472f"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #2a2623; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .soft { fill: #5e574f; }
      .rust { fill: #b4472f; }
      .ok { fill: #2f6f5e; }
    </style>
  </defs>

  <rect width="960" height="480" rx="20" fill="#faf7f2"/>

  <!-- column headers -->
  <text x="390" y="64" font-size="18" font-weight="700" text-anchor="middle" class="ok">check is green</text>
  <text x="750" y="64" font-size="18" font-weight="700" text-anchor="middle" class="rust">check is red</text>

  <!-- row headers -->
  <text x="44" y="150" font-size="18" font-weight="700">claim is true</text>
  <text x="44" y="174" font-size="14" class="soft">the code is right</text>
  <text x="44" y="300" font-size="18" font-weight="700">claim is false</text>
  <text x="44" y="324" font-size="14" class="soft">the code is wrong</text>

  <!-- true / green -->
  <rect x="220" y="90" width="340" height="130" rx="14" fill="#e3efe9" stroke="#2f6f5e"/>
  <text x="240" y="128" font-size="18" font-weight="700">fine</text>
  <text x="240" y="154" font-size="15" class="soft">the usual case, every day</text>

  <!-- true / red -->
  <rect x="580" y="90" width="340" height="130" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="600" y="128" font-size="18" font-weight="700">false alarm</text>
  <text x="600" y="154" font-size="15" class="soft">annoying, but you see it</text>

  <!-- false / green: the dangerous one -->
  <rect x="220" y="240" width="340" height="130" rx="14" fill="#f6e1db" stroke="#b4472f" stroke-width="2.5"/>
  <text x="240" y="278" font-size="18" font-weight="700" class="rust">the dangerous cell</text>
  <text x="240" y="304" font-size="15" class="soft">wrong code, green check</text>
  <text x="240" y="328" font-size="15" class="soft">looks exactly like "fine"</text>

  <!-- false / red -->
  <rect x="580" y="240" width="340" height="130" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="600" y="278" font-size="18" font-weight="700">caught</text>
  <text x="600" y="304" font-size="15" class="soft">the check did its job</text>

  <!-- annotation -->
  <path d="M600 420 C470 420 420 410 400 378" fill="none" stroke="#b4472f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-rust)"/>
  <text x="612" y="416" font-size="15" class="rust" font-weight="700">break the code on purpose</text>
  <text x="612" y="438" font-size="14" class="soft">to find out whether this cell exists</text>
</svg>
