<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">How this blog is built and served</title>
  <desc id="d">Posts are MDX files in a Git repository. Next.js builds them into a static site that Cloudflare Pages serves to the reader's browser. The browser counts visits by calling a Cloudflare Pages Function, which stores counters in a D1 database. Comments are loaded from Giscus, which stores them in GitHub Discussions.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5e574f"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #2a2623; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .soft { fill: #5e574f; }
      .lbl { font-size: 15px; fill: #5e574f; }
      .row { font-size: 14px; font-weight: 700; letter-spacing: .08em; fill: #8a8177; }
      .t { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .s { font-size: 16px; text-anchor: middle; fill: #5e574f; }
    </style>
  </defs>

  <rect width="960" height="520" rx="20" fill="#faf7f2"/>

  <text x="40" y="36" class="row">1 · PUBLISH</text>
  <text x="40" y="214" class="row">2 · COUNT A VISIT</text>
  <text x="40" y="382" class="row">3 · COMMENTS</text>

  <!-- Row 1 -->
  <rect x="40" y="52" width="230" height="92" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="155" y="92" class="t">MDX posts</text>
  <text x="155" y="118" class="s">in a Git repository</text>

  <rect x="365" y="52" width="230" height="92" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="480" y="92" class="t">Next.js build</text>
  <text x="480" y="118" class="s">static export + search</text>

  <rect x="690" y="52" width="230" height="92" rx="14" fill="#2f6f5e"/>
  <text x="805" y="92" class="t" style="fill:#fff">Cloudflare Pages</text>
  <text x="805" y="118" class="s" style="fill:#cfe6dc">serves plain files</text>

  <path d="M272 98 L361 98" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M597 98 L686 98" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Down: Pages -> Browser -->
  <path d="M805 146 L805 228" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="820" y="192" class="lbl">static pages</text>

  <!-- Row 2 -->
  <rect x="690" y="230" width="230" height="92" rx="14" fill="#e3efe9" stroke="#2f6f5e"/>
  <text x="805" y="270" class="t">Reader's browser</text>
  <text x="805" y="296" class="s">search runs locally</text>

  <path d="M688 276 L599 276" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="643" y="262" class="lbl" text-anchor="middle">a tiny POST</text>

  <rect x="365" y="230" width="230" height="92" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="480" y="270" class="t">Pages Function</text>
  <text x="480" y="296" class="s mono">/api/view</text>

  <path d="M363 276 L274 276" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="318" y="262" class="lbl" text-anchor="middle">salted hash</text>

  <rect x="40" y="230" width="230" height="92" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="155" y="270" class="t">D1 database</text>
  <text x="155" y="296" class="s">counters only</text>

  <!-- Down: Browser -> Giscus -->
  <path d="M805 324 L805 410" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="820" y="372" class="lbl">comment box</text>

  <!-- Row 3 -->
  <rect x="690" y="412" width="230" height="92" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="805" y="452" class="t">Giscus widget</text>
  <text x="805" y="478" class="s">under each post</text>

  <path d="M688 458 L599 458" stroke="#5e574f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <rect x="365" y="412" width="230" height="92" rx="14" fill="#fff" stroke="#d6ccbc"/>
  <text x="480" y="452" class="t">GitHub Discussions</text>
  <text x="480" y="478" class="s">one thread per post</text>
</svg>
